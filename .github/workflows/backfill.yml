name: Backfill blog cards

# One-off maintenance: fires when .github/backfill-trigger.txt changes.
on:
  push:
    paths:
      - ".github/backfill-trigger.txt"

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill cards
        run: python automation/backfill_cards.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog blog.html sitemap.xml automation/posts.json assets/blog
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: backfill title cards for older posts"
            ok=""
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "push attempt $i rejected; rebasing"
              git pull --rebase --quiet || true
              sleep 5
            done
            [ -n "$ok" ] || { echo "push failed after 3 attempts"; exit 1; }
          fi
