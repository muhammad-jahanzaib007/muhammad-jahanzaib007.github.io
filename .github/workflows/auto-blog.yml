name: Auto blog

# Publishes a new post twice a day at 09:00 + 21:00 UK time; each post
# auto-shares to LinkedIn, so LinkedIn also gets two posts a day.
#
# SINGLE FIRING SOURCE (2026-07-11): NO `schedule:` crons here. GitHub's
# scheduler fires late and replays hours later — racing it against the
# heartbeat Worker double-posted 3 slots in a row on 2026-07-10/11. The
# Cloudflare heartbeat Worker (ai-tools-yt repo, heartbeat/) is the ONLY
# scheduled trigger; it dispatches at 08:00/20:00 UTC exactly and retries
# via :20/:40 sweeps. Do NOT re-add crons here.
# Uses Claude (Anthropic API) when ANTHROPIC_API_KEY is set; else free GitHub Models.
# Also runnable on demand from the Actions tab (Run workflow).
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/blog-trigger.txt"

permissions:
  contents: write
  models: read
  pages: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  # SAFETY NET ONLY: with schedule crons removed (single firing source =
  # heartbeat Worker) this never triggers. It stays so that if anyone ever
  # re-adds a cron, a late replay skips itself whenever ANY other auto-blog
  # run was created at/after its slot time (this exact race double-posted
  # 3 slots on 2026-07-10/11). Manual dispatches and trigger pushes are
  # never blocked.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.dedupe.outputs.skip }}
    steps:
      - name: Skip a cron whose slot another run already covers
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            slot='${{ github.event.schedule }}'
            m=$(echo "$slot" | cut -d' ' -f1)
            h=$(echo "$slot" | cut -d' ' -f2)
            slot_ts=$(date -u -d "$(date -u +%F) ${h}:${m}:00" +%s)
            lag_min=$(( ( $(date -u +%s) - slot_ts ) / 60 ))
            echo "cron slot '$slot' fired ${lag_min} min after its slot time"
            slot_iso=$(date -u -d "@${slot_ts}" +%FT%TZ)
            others=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/auto-blog.yml/runs?per_page=20" \
                     --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .created_at >= \"$slot_iso\")] | length" \
                     2>/dev/null || echo 0)
            if [ "${others:-0}" -gt 0 ]; then
              echo "slot already covered by ${others} other run(s) since ${slot_iso} - skipping"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  post:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Generation retries + the 15-min LinkedIn liveness wait fit well inside
    # this; a hung API call must not hold the job for GitHub's 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'openai/gpt-4o-mini' }}
          # Optional: add an ANTHROPIC_API_KEY secret to use Claude instead of free GitHub Models.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python automation/generate_post.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each path individually: one missing pathspec in a combined
          # `git add a b c` fails the WHOLE add (nothing staged) — the exact
          # failure that lost the YT repo's receipts on 2026-07-05.
          for f in blog blog.html sitemap.xml feed.xml automation/posts.json automation/topics.json assets/blog .github/last-blog.txt; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto blog post ($(date -u +%Y-%m-%d))"
            # Rebase-retry: a concurrent push to main must not kill the run.
            # `-X theirs` + abort-on-fail: a plain `git pull --rebase` that
            # hits a conflict in a pointer/ledger file (posts.json, feed.xml)
            # leaves a stuck rebase whose "unmerged files" state then fails
            # every later retry (this deadlocked the YT repo's publish on
            # 2026-07-17). `-X theirs` keeps THIS run's post; abort clears any
            # half-finished rebase before the next attempt.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected; cleaning up + rebasing (attempt $i)"
              git pull --rebase -X theirs || { git rebase --abort 2>/dev/null || true; }
              if [ "$i" = 5 ]; then echo "push failed after 5 attempts"; exit 1; fi
            done
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Share to LinkedIn
        if: steps.commit.outputs.published == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202606' }}
          # Used to request a Pages rebuild if the article URL stays 404
          # (a failed Pages build once put a dead link on LinkedIn).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/post_to_linkedin.py

      # Receipt + li_shared flags land in a follow-up commit so the run's
      # outcome is verifiable from the repo (Actions logs need admin auth).
      - name: Record share receipt
        if: always() && steps.commit.outputs.published == 'true'
        run: |
          git add .github/last-share.txt automation/posts.json
          if git diff --cached --quiet; then echo "no receipt changes"; exit 0; fi
          git commit -m "chore: linkedin share receipt"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected; cleaning up + rebasing (attempt $i)"
            git pull --rebase -X theirs || { git rebase --abort 2>/dev/null || true; }
          done
          echo "receipt push failed"; exit 1
