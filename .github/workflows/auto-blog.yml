name: Auto blog

# Publishes a new post twice a day (09:00 + 21:00 UTC); each post auto-shares
# to LinkedIn, so LinkedIn also gets two posts a day.
# Uses Claude (Anthropic API) when ANTHROPIC_API_KEY is set; else free GitHub Models.
# Also runnable on demand from the Actions tab (Run workflow).
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/blog-trigger.txt"

permissions:
  contents: write
  models: read
  pages: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade requests anthropic pillow

      - name: Generate post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'openai/gpt-4o-mini' }}
          # Optional: add an ANTHROPIC_API_KEY secret to use Claude instead of free GitHub Models.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python automation/generate_post.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog blog.html sitemap.xml automation/posts.json automation/topics.json assets/blog .github/last-blog.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto blog post ($(date -u +%Y-%m-%d))"
            # Rebase-retry: a concurrent push to main must not kill the run
            # (same failure once skipped a whole publish in the YT repo).
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push rejected; rebasing (attempt $i)"
              git pull --rebase
              if [ "$i" = 3 ]; then echo "push failed after 3 attempts"; exit 1; fi
            done
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Share to LinkedIn
        if: steps.commit.outputs.published == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202606' }}
          # Used to request a Pages rebuild if the article URL stays 404
          # (a failed Pages build once put a dead link on LinkedIn).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/post_to_linkedin.py

      # Receipt + li_shared flags land in a follow-up commit so the run's
      # outcome is verifiable from the repo (Actions logs need admin auth).
      - name: Record share receipt
        if: always() && steps.commit.outputs.published == 'true'
        run: |
          git add .github/last-share.txt automation/posts.json
          if git diff --cached --quiet; then echo "no receipt changes"; exit 0; fi
          git commit -m "chore: linkedin share receipt"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; rebasing (attempt $i)"
            git pull --rebase
          done
          echo "receipt push failed"; exit 1
