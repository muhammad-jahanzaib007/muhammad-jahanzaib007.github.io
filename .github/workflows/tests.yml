name: Tests

# Pure-function tests for the blog generator, run on any code push so a bad
# edit is caught before the next auto-blog cron rather than by it.
on:
  push:
    paths:
      - "automation/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pytest==9.1.1 -r requirements.txt

      - run: python -m pytest tests -q
