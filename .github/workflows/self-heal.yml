name: Self-heal

# Same self-sustaining pattern as the YT repo:
# Layer 1: a failed Auto blog run is retried once (transient LLM/network
#   flakes clear on retry); a second failure opens ONE labelled issue,
#   titled needs-human when the receipts look like credentials (the LinkedIn
#   token expiring ~every 60 days is the known out-of-domain case).
# Layer 2 (missed-slot dispatch) RETIRED 2026-07-10: the external Cloudflare
#   heartbeat now covers a missed 08:00/20:00 blog slot per-slot (verified
#   dispatching — /?probe returned 204). A cron backstop dies in a wholesale
#   GitHub scheduler outage anyway, and — like the YT self-heal backstops
#   retired 2026-07-08 — a LATE-replayed backstop cron over-fires an EXTRA
#   blog post (last run reads as >60 min stale). On a quality-sensitive site
#   an extra padded post is worse than a briefly-missed slot.
# The 08:50/20:50 schedule crons are KEPT solely to drive the `if: always()`
#   Pages-deploy heal below (safe — re-runs the same commit's artifact);
#   they no longer dispatch auto-blog.
on:
  workflow_run:
    workflows: ["Auto blog"]
    types: [completed]
  schedule:
    - cron: "50 8 * * *"    # 08:50 UTC — Pages-deploy heal only
    - cron: "50 20 * * *"   # 20:50 UTC — Pages-deploy heal only
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry a failed blog run once, escalate a repeat
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" != "failure" ]; then
            echo "auto blog concluded: $CONCLUSION; nothing to heal"
            exit 0
          fi
          if [ "$ATTEMPT" -lt 2 ]; then
            echo "retrying failed auto-blog run $RUN_ID (was attempt $ATTEMPT)"
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "auto blog failed twice; escalating"
          share=$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/.github/last-share.txt" || echo "(no receipt)")
          title="Self-heal: auto blog failed twice, retry did not fix it"
          if printf '%s' "$share" | grep -qiE "401|403|invalid_grant|unauthorized|token|expired"; then
            title="Self-heal: auto blog NEEDS A HUMAN (LinkedIn token / credentials)"
          fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label watchdog --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "watchdog issue already open; not duplicating"
            exit 0
          fi
          gh label create watchdog --repo "$GITHUB_REPOSITORY" \
            --description "automated pipeline health alert" --color D93F0B 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label watchdog \
            --title "$title" \
            --body "$(printf 'Auto blog failed on both attempts: %s\n\nLast share receipt:\n```\n%s\n```\n' "$RUN_URL" "$share")"

      # GitHub's managed "pages build and deployment" workflow intermittently
      # fails with "Deployment failed, try again later" (4x on 2026-07-06
      # alone) — a GitHub-side transient we can't patch, only re-kick. It is
      # not in .github/workflows, so workflow_run can't watch it; instead
      # every self-heal invocation checks the latest Pages build and re-runs
      # it if it failed. A re-run redeploys the SAME commit's artifact, so
      # this is always safe.
      - name: Heal a failed Pages deploy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=20" \
                  --jq '[.workflow_runs[] | select(.name=="pages build and deployment")][0] // empty')
            if [ -z "$run" ]; then echo "no pages runs found"; exit 0; fi
            id=$(jq -r '.id' <<<"$run")
            concl=$(jq -r '.conclusion // "in_progress"' <<<"$run")
            echo "latest pages build $id: $concl (check $attempt)"
            case "$concl" in
              success) exit 0 ;;
              failure)
                echo "re-running failed Pages deploy"
                gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY" || true
                sleep 90 ;;
              *) sleep 60 ;;   # queued / in_progress: wait and re-check
            esac
          done
          echo "Pages build still not green after healing attempts (watchdog will alert if it stays red)"
